name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The composite actions are for callers, who get them fetched by reference. A local `./`
    # action needs the repository checked out before it can be resolved, so using one here would
    # mean checking out twice; the steps it wraps are spelled out instead.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The boundary is the product here, so it is a check and not a review note.
      - run: ./scripts/no-entity-leak.sh
      - run: ./scripts/no-entity-leak.test.sh

  # Dogfooding: the guard that every caller gets, run against this repository's own pull requests.
  guard:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/guard.yml
    with:
      base-ref: ${{ github.base_ref }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      authors: dependabot[bot],autopilot[bot]
      pr-author: ${{ github.event.pull_request.user.login }}

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4
        with:
          category: /language:javascript-typescript
