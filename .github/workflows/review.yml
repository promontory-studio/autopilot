name: review

# Reviews an open pull request once its CI has finished, approves it when it is clean, and — only
# at `mode: on` — enables auto-merge. The merge is decided by the shell here, not by the model: it
# re-reads the pull request and requires an approval that still sits at the head it reviewed.
#
# Call this from a `workflow_run` trigger, never from inside the CI run it waits on: a job that
# watches the checks of its own run waits on itself and the pull request never merges.

on:
  workflow_call:
    inputs:
      mode:
        description: "`off` does nothing, `dry-run` reviews and approves, `on` also merges."
        type: string
        default: dry-run
      pr-number:
        required: true
        type: string
      head-sha:
        description: Head the CI run tested. The merge refuses to fire at any other head.
        required: true
        type: string
      ci-conclusion:
        required: true
        type: string
      head-branch:
        type: string
        default: ""
      reviewer-pattern:
        description: Regex an approving review's author must match for the merge to fire.
        type: string
        default: claude
      merge-method:
        type: string
        default: squash
      merge-method-by-base:
        description: 'JSON overriding the method per base branch, e.g. {"main":"merge"}.'
        type: string
        default: "{}"
      hold-labels:
        description: Comma-separated labels that veto the merge.
        type: string
        default: hold,autopilot:needs-human
      needs-human-label:
        type: string
        default: autopilot:needs-human
      allowed-bots:
        description: Bot logins whose pull requests the review action is allowed to act on.
        type: string
        default: dependabot[bot]
      retarget-base:
        description: >
          Branch to move an automated pull request onto when it was raised against the default
          branch. Empty leaves every base alone. A repository that promotes its integration branch
          whole wants `dev` here: security updates are always raised against the default branch,
          and merging one there diverges it from the branch it is supposed to receive whole.
        type: string
        default: ""
      model:
        type: string
        default: ""
      app-id:
        description: GitHub App to merge as. Without one the merge is skipped, because a merge
          pushed with GITHUB_TOKEN starts no downstream workflow.
        type: string
        default: ""
      repair-repo:
        description: Repository to send a `repository_dispatch` to when CI failed on an automated
          branch. Empty sends nothing.
        type: string
        default: ""
      repair-event:
        type: string
        default: autopilot-repair
      no-review-update-types:
        description: >
          Comma-separated dependency update types (`minor,patch`) that may merge on green CI with
          no model review. Empty — the default — reviews every bump, as before. A branch carrying
          any commit that is not the bot's own signed work is reviewed whatever is named here.
        type: string
        default: ""
      no-review-branch-prefixes:
        description: >
          Comma-separated head-branch prefixes whose bumps may merge with no model review whatever
          the update type, for an ecosystem whose whole diff is a pin. Empty exempts nothing.
        type: string
        default: ""
      bot-branch-prefix:
        description: >
          Prefix of the branches the dependency bot opens. Both the retarget and the repair below
          are keyed on it rather than on the author, so a branch that keeps failing is handled
          again on its next run.
        type: string
        default: dependabot/
    secrets:
      anthropic-api-key:
        required: true
      app-key:
        required: false
      repair-token:
        description: Used for the dispatch when no App is configured.
        required: false

jobs:
  review:
    if: inputs.mode != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      # Hoisted above the review because the retarget below needs it: a base change pushed with
      # GITHUB_TOKEN starts no workflow, so the pull request would keep checks measured against the
      # base it no longer has. An App's does.
      - id: app
        if: inputs.app-id != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-key }}

      # Keyed on the BRANCH PREFIX, not on the author. The App opens the daily promotion pull
      # request too — from the default branch's own history, into the default branch — and moving
      # that one onto the integration branch would stop promotion arriving, silently.
      - name: Move a dependency bot's pull request off the default branch
        if: >
          inputs.retarget-base != '' &&
          startsWith(inputs.head-branch, inputs.bot-branch-prefix)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          PR: ${{ inputs.pr-number }}
          TARGET: ${{ inputs.retarget-base }}
        run: |
          set -euo pipefail
          # Asked of the API rather than read off `github.event.repository`, whose shape depends on
          # the caller's trigger — a property that is absent interpolates to the empty string, and
          # every base would then look like the default branch.
          DEFAULT=$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef -q .defaultBranchRef.name)
          base=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json baseRefName -q .baseRefName)
          if [ "$base" != "$DEFAULT" ] || [ "$base" = "$TARGET" ]; then
            echo "base is $base; nothing to move"
            exit 0
          fi
          gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --base "$TARGET"
          # The base alone is not enough. The branch was cut from the default branch, so the pull
          # request would now read as "everything the default branch has that the target does not,
          # plus the bump" — including any path the promotion deliberately keeps back. `rebase`
          # recreates the branch from its new base, leaving only the bump.
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" -b "$(printf '%s\n\n%s' \
            "Moved onto \`$TARGET\`, because \`$DEFAULT\` receives \`$TARGET\` whole and a merge here would diverge it." \
            "@dependabot rebase")"

      # Every conjunct keeps an existing path byte-identical. `dry-run` and a caller with no App
      # both still review: in either, the merge below cannot fire, so skipping the review would
      # make the whole workflow a silent no-op rather than a cheaper one. A red bump is the repair
      # lane's, not this one's.
      - name: Could this bump skip the review?
        id: lane
        if: >
          inputs.mode == 'on' && steps.app.outputs.token != '' &&
          inputs.ci-conclusion == 'success' &&
          startsWith(inputs.head-branch, inputs.bot-branch-prefix) &&
          (inputs.no-review-update-types != '' || inputs.no-review-branch-prefixes != '')
        run: echo "ask=true" >> "$GITHUB_OUTPUT"

      # Self-locating: the `job` context describes the workflow this job came from, the `github`
      # context the caller's. Checked out beside the caller, which the next step then replaces.
      - if: steps.lane.outputs.ask == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pedalion-host
          persist-credentials: false
      - if: steps.lane.outputs.ask == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - if: steps.lane.outputs.ask == 'true'
        working-directory: .pedalion-host
        run: npm ci

      - name: Does this bump need judgement?
        id: bump
        if: steps.lane.outputs.ask == 'true'
        working-directory: .pedalion-host
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ inputs.pr-number }}
          TYPES: ${{ inputs.no-review-update-types }}
          PREFIXES: ${{ inputs.no-review-branch-prefixes }}
        run: |
          set -euo pipefail
          reason=$(npx tsx src/bump-main.ts --repo "$GITHUB_REPOSITORY" --pr "$PR" \
            --no-review-types "$TYPES" --no-review-branch-prefixes "$PREFIXES")
          if [ -z "$reason" ]; then
            echo "::notice::merging on green CI with no model review"
            echo "no-review=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::reviewing: $reason"
          fi

      - if: steps.bump.outputs.no-review != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false

      - if: steps.bump.outputs.no-review != 'true'
        uses: anthropics/claude-code-action@b949468893d8bba436c9c71ea860b1f5f344804e # v1
        with:
          anthropic_api_key: ${{ secrets.anthropic-api-key }}
          allowed_bots: ${{ inputs.allowed-bots }}
          claude_args: >-
            ${{ inputs.model && format('--model {0} ', inputs.model) }}--allowedTools
            "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr edit:*)"
          prompt: |
            The CI workflow just finished (conclusion: ${{ inputs.ci-conclusion }})
            for PR #${{ inputs.pr-number }} in this repo.

            - If CI did not succeed: comment on the PR with
              `gh pr comment ${{ inputs.pr-number }} -b "CI is failing, not reviewing yet."`
              and stop — do not approve or merge.
            - Otherwise, review the PR for correctness bugs and for
              reuse/simplification/efficiency issues, at the bar of a high-effort code
              review. Read the diff with `gh pr diff ${{ inputs.pr-number }}`.
              - If there are no blocking issues: approve with
                `gh pr review ${{ inputs.pr-number }} --approve -b "<one-line summary of
                what you checked>"`. Do not merge; a later step does.
              - If there are blocking issues: post them as one review comment with
                `gh pr comment ${{ inputs.pr-number }}` (most severe first, with
                file:line references) and do not approve or merge.
              - If you are not confident in the verdict, say so in a comment, run
                `gh pr edit ${{ inputs.pr-number }} --add-label ${{ inputs.needs-human-label }}`,
                and do not approve or merge.

      - name: Merge if approved at this head
        if: inputs.mode == 'on' && steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ inputs.pr-number }}
          HEAD_SHA: ${{ inputs.head-sha }}
          PATTERN: ${{ inputs.reviewer-pattern }}
          HOLD: ${{ inputs.hold-labels }}
          NO_REVIEW: ${{ steps.bump.outputs.no-review }}
          METHOD: ${{ inputs.merge-method }}
          BY_BASE: ${{ inputs.merge-method-by-base }}
        run: |
          set -euo pipefail
          pr=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json labels,headRefOid,latestReviews,baseRefName)
          # Three separate properties, deliberately not one boolean. Only the approval can be
          # waived: the head must still be the one CI tested, and a hold label vetoes either way.
          head_ok=$(jq --arg sha "$HEAD_SHA" '.headRefOid == $sha' <<<"$pr")
          approved=$(jq --arg p "$PATTERN" 'any(.latestReviews[]; .state == "APPROVED" and (.author.login | test($p)))' <<<"$pr")
          held=$(jq --arg h "$HOLD" '[$h | split(",")[]] as $bad | any(.labels[].name; . as $l | $bad | index($l))' <<<"$pr")
          base=$(jq -r .baseRefName <<<"$pr")
          method=$(jq -r --arg b "$base" --arg d "$METHOD" '.[$b] // $d' <<<"$BY_BASE")
          echo "head_ok=$head_ok approved=$approved no_review=${NO_REVIEW:-} held=$held base=$base method=$method"
          if [ "$head_ok" = true ] && [ "$held" != true ] && { [ "$approved" = true ] || [ "${NO_REVIEW:-}" = true ]; }; then
            gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --auto "--$method" --delete-branch
          fi

  repair:
    # Keyed on the branch rather than the author, so a repair that still fails CI is dispatched
    # again; the receiving repository is what caps the attempts.
    if: >
      inputs.mode != 'off' && inputs.repair-repo != '' &&
      inputs.ci-conclusion == 'failure' &&
      startsWith(inputs.head-branch, inputs.bot-branch-prefix)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: target
        run: echo "owner=${REPO%%/*}" >> "$GITHUB_OUTPUT"; echo "name=${REPO##*/}" >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ inputs.repair-repo }}
      - id: app
        if: inputs.app-id != ''
        # An App that is not installed on the repair repository's owner 404s here. That is a
        # reason to fall through to `repair-token` below, not to fail the review workflow.
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-key }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.repair-token }}
          TARGET: ${{ inputs.repair-repo }}
          EVENT: ${{ inputs.repair-event }}
          PR: ${{ inputs.pr-number }}
          BRANCH: ${{ inputs.head-branch }}
        run: |
          set -euo pipefail
          gh api "repos/$TARGET/dispatches" -f "event_type=$EVENT" \
            -F "client_payload[pr]=$PR" \
            -f "client_payload[branch]=$BRANCH" \
            -f "client_payload[repo]=$GITHUB_REPOSITORY"
