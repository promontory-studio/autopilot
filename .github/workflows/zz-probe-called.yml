name: zz-probe-called
on:
  workflow_call:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "github.workflow_ref=${{ github.workflow_ref }}"
          echo "github.workflow_sha=${{ github.workflow_sha }}"
          echo "github.job_workflow_ref=${{ github.job_workflow_ref }}"
          echo "github.job_workflow_sha=${{ github.job_workflow_sha }}"
      - run: echo '${{ toJSON(github) }}' | grep -iE "workflow_ref|workflow_sha|action_ref|action_repo" || true
      - run: echo '${{ toJSON(job) }}'
