name: autopilot

# This repository calling its own reusable review workflow. Inert until `AUTOPILOT` is set, which
# is also the switch that turns it off again.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: autopilot-${{ github.event.workflow_run.pull_requests[0].number || github.sha }}
  cancel-in-progress: true

jobs:
  review:
    if: >
      vars.AUTOPILOT != '' && vars.AUTOPILOT != 'off' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    uses: ./.github/workflows/review.yml
    with:
      mode: ${{ vars.AUTOPILOT }}
      pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
      head-sha: ${{ github.event.workflow_run.head_sha }}
      ci-conclusion: ${{ github.event.workflow_run.conclusion }}
      head-branch: ${{ github.event.workflow_run.head_branch }}
      app-id: ${{ vars.AUTOPILOT_APP_ID }}
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      app-key: ${{ secrets.AUTOPILOT_APP_KEY }}
